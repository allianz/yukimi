name: Scorecard supply-chain security

on:
  # Re-score when branch protection changes, since that is a graded check.
  branch_protection_rule:
  # Weekly, Saturday 01:30 UTC.
  schedule:
    - cron: '30 1 * * 6'
  push:
    # Only the default branch is supported by the action.
    branches: [ main ]
  # Manual re-run, e.g. to verify a fix. Experimental per the action's own docs.
  workflow_dispatch:

# Least privilege by default; the job below widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF result to the Code scanning dashboard.
      security-events: write
      # Needed for the GitHub OIDC token when publish_results is true.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API, which is what makes the README
          # badge and https://scorecard.dev/viewer work. Public repo, public data.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
