name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reviewable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The build submodule downloads its own pinned binaries (golangci-lint,
      # kustomize, the Crossplane CLI, kind, kubectl) into .cache/tools on every
      # run. Nothing about them depends on our code, only on the versions pinned
      # in the Makefile and in build/makelib/k8s_tools.mk -- so those files are
      # the cache key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'build/makelib/k8s_tools.mk') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - run: make reviewable

      # `make generate` regenerates package/crds and deploy/install.yaml, so this
      # fails the build if either committed copy is stale. Cheap here: reviewable
      # has already warmed the tool and module caches.
      - run: make check-diff

      # Schema-validate the rendered install file against the upstream Kubernetes
      # schemas. -strict rejects unknown fields, which is what catches typos such
      # as readOnlyRootFileSystem that a plain apply accepts and ignores.
      #
      # kubeconform rather than kubeval, which is unmaintained. Pinned by digest,
      # not tag, because this repository is scored by OpenSSF Scorecard and a
      # mutable tag is an unpinned dependency. v0.8.0.
      #
      # -skip CustomResourceDefinition: the upstream schema set kubeconform
      # defaults to has no schema for apiextensions CRDs, so they would report as
      # errors rather than as validated. Our own CRDs are generated by
      # controller-gen and rejected by the API server if malformed; the point of
      # this step is the seven hand-written objects.
      - name: Validate deploy/install.yaml
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          entrypoint: /kubeconform
          args: -strict -summary -skip CustomResourceDefinition deploy/install.yaml

      # Coverage is computed by `make test` and would otherwise be written into
      # _output and thrown away with the runner. Kept as an artifact so a reviewer
      # can see what a pull request did to it. Deliberately not a gate: the specs
      # state a 95% target in prose, and turning that into a hard threshold is a
      # maintainer decision, not a side effect of wiring up an upload.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: _output/tests/*/coverage.txt
          retention-days: 14
          if-no-files-found: warn

  # Separate job: the fuzz targets are the only tests here whose runtime is a
  # dial rather than a fact, so they must not sit on the critical path of the
  # gate. `go test -run=^$ -fuzz=...` runs one target at a time by design, hence
  # the explicit list -- a new FuzzXxx needs a line here to be exercised in CI.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # 30s each is smoke-testing, not a fuzzing campaign: enough to catch a
      # panic introduced by the change under review, and short enough that nobody
      # is tempted to delete the job. Real campaigns are run out of band.
      #
      # A crash writes a reproducer into testdata/fuzz/, which the failing run
      # uploads below -- commit it as a regression case.
      - name: Fuzz identifier and literal rendering
        run: |
          set -euo pipefail
          go test ./internal/snowflake/statement/ -run='^$' -fuzz=FuzzQuoteIdentifier -fuzztime=30s
          go test ./internal/snowflake/statement/ -run='^$' -fuzz=FuzzQuoteLiteral    -fuzztime=30s
          go test ./internal/snowflake/statement/ -run='^$' -fuzz=FuzzBareIdentifier  -fuzztime=30s

      - name: Fuzz account naming and host construction
        run: |
          set -euo pipefail
          go test ./internal/account/tenant/ -run='^$' -fuzz=FuzzResolveName     -fuzztime=30s
          go test ./internal/snowflake/host/ -run='^$' -fuzz=FuzzHostnameAndURL  -fuzztime=30s

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers
          path: "**/testdata/fuzz/**"
          retention-days: 30
          if-no-files-found: ignore
