apiVersion: v1
kind: ServiceAccount
metadata:
  # This name is load-bearing outside the cluster: the AWS IAM trust policy for
  # the controller's role must name it exactly, as
  #   sub = system:serviceaccount:yukimi-system:yukimi-controller
  # Renaming it breaks IRSA with an AssumeRoleWithWebIdentity error rather than
  # anything that mentions Kubernetes.
  name: yukimi-controller
  # No eks.amazonaws.com/role-arn annotation here on purpose. The base must stay
  # free of any account-specific identifier, so the ARN is patched in by
  # deploy/overlays/site/. On EKS that single annotation is the entire
  # credential story: the pod-identity webhook injects AWS_ROLE_ARN and a
  # projected token, and internal/secrets/aws picks them up through the SDK's
  # default credential chain without reading any environment variable itself.
automountServiceAccountToken: true
