# Base install for the Yukimi controller.
#
# Build this with `make manifests`, not with `kustomize build` directly.
#
# A bare `kustomize build deploy/base` FAILS, with:
#   security; file '.../package/crds/....yaml' is not in or below '.../deploy/base'
# because the CRD resources below live outside this directory. The make target
# passes --load-restrictor=LoadRestrictionsNone, which is safe here: that
# restriction exists to stop a *remote* base from reading local files, and this
# is a local root in our own repository.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All namespaced objects land here, and kustomize also rewrites subjects[].namespace
# in both bindings -- so the install namespace is this one line. Kustomize knows
# which kinds are cluster-scoped, so Namespace, ClusterRole, ClusterRoleBinding
# and the CRDs are correctly left alone.
namespace: yukimi-system

labels:
  - pairs:
      app.kubernetes.io/name: yukimi
      app.kubernetes.io/part-of: yukimi
      app.kubernetes.io/managed-by: kustomize
    # Both default to false. Stated explicitly because the entire point is that
    # they must stay false, and a maintainer reaching for `commonLabels` (which
    # is this block with includeSelectors: true) would break upgrades:
    # spec.selector is immutable on a live Deployment. See deployment.yaml.
    includeSelectors: false
    includeTemplates: false

# Pinned rather than left to the default, so a future kustomize release cannot
# reorder the rendered install.yaml. kubectl applies documents in file order, and
# `legacy` is the ordering that puts Namespace and CRDs before the objects that
# depend on them -- which is what makes a single-file `kubectl apply` work on a
# cluster that has never seen Yukimi before.
sortOptions:
  order: legacy

resources:
  # The CRDs are generated by `make generate` (apis/generate.go runs
  # `rm -rf ../package/crds` first, so nothing can be stored alongside them) and
  # are referenced here rather than copied, so there is exactly one copy in the
  # repository and no way for the two to drift.
  #
  # Listed file by file: kustomize does not expand globs -- it treats the entry
  # as a literal path and fails with "must build at directory". A new CRD must
  # therefore be added here by hand; `make manifests` cross-checks this list
  # against the contents of package/crds/ and fails if they disagree, because a
  # CRD silently missing from install.yaml is an outage that would otherwise
  # render as a green build.
  - ../../package/crds/base.snowflake.yukimi.io_snowflakeaccounts.yaml
  - ../../package/crds/base.snowflake.yukimi.io_snowflakedeletionrequests.yaml

  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - role-leaderelection.yaml
  - rolebinding-leaderelection.yaml
  - deployment.yaml

  # Deliberately absent:
  #
  #   * The yukimi-config ConfigMap. It holds site values, and install.yaml is
  #     re-applied on upgrade -- including it would overwrite the operator's
  #     Snowflake organization with a placeholder. It ships as the separate
  #     deploy/config.example.yaml.
  #
  #   * A metrics Service. The metrics endpoint is unauthenticated (no
  #     kube-rbac-proxy, no authn filter), nothing scrapes it today, and
  #     `kubectl port-forward` needs no Service. Adding one would be pure
  #     attack surface.
  #
  #   * A PodDisruptionBudget. With a single replica any PDB that allows zero
  #     disruptions blocks node drains, and one that allows one is a no-op.
  #
  #   * namePrefix / nameSuffix. A CRD's metadata.name must be exactly
  #     <plural>.<group>; a prefix makes the API server reject it.
