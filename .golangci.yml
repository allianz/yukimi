# golangci-lint configuration.
#
# The version of the binary is pinned in the Makefile (GOLANGCILINT_VERSION), not
# here; keep the two in step when upgrading, because the v2 schema below is not
# understood by v1.
#
# `make lint` is part of `make reviewable`, which is what CI gates on. The
# selection below is deliberately not `default: all`: every enabled linter is one
# a reviewer would otherwise have to enforce by hand, and the comments record why.
version: "2"

run:
  timeout: 10m
  # Test files carry as much of the design as production code here (roughly a
  # 2:1 test-to-production line ratio), so they are linted too.
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

  enable:
    # --- Conventions this project states in CLAUDE.md and CONTRIBUTING.md ---
    # "In Observe, never return nil on error." nilerr is the mechanical form of
    # that rule: it catches returning nil after checking err != nil.
    - nilerr
    # Every file must carry the Apache-2.0 header. 92 of 92 Go files were correct
    # by convention alone; this is what keeps them that way. See settings below.
    - goheader
    # Errors are wrapped with %w so the user/system classification survives.
    # errorlint catches %v on an error and comparisons that break wrapping.
    - errorlint

    # --- Correctness ---
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - copyloopvar
    - predeclared
    - reassign

    # --- Clarity ---
    - dupword
    - misspell
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace

    # --- Tests ---
    - thelper
    - tparallel

    # A bare //nolint with no explanation is how a real finding gets buried.
    - nolintlint

  settings:
    goheader:
      values:
        regexp:
          # Files inherited from the Crossplane provider template keep the
          # original Crossplane line above ours; new files carry only ours.
          # Both shapes are one comment block, so one optional line covers it.
          # See "Copyright Headers" in CLAUDE.md.
          copyright: '(Copyright \d{4} The Crossplane Authors\.\n)?Copyright \d{4} The Yukimi Authors\.'
      template: |-
        {{ copyright }}

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.

    misspell:
      locale: US

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: exported
          # Comment-on-every-exported-symbol, but not the "comment should be of
          # the form 'Name ...'" nit, which fights with the doc style here.
          arguments: [ "disableStutteringCheck" ]
        - name: package-comments
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: error-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    # zz_generated.* and other generated files are excluded from everything;
    # "lax" also skips files whose header says they are generated.
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          # An unchecked Close/Write in a test that is about to assert on the
          # result is noise, not a bug.
          - errcheck
          - dupword
          # Tests assert on error *identity* on purpose: several specs require a
          # module's error to be propagated unchanged, and `err != wantErr` is a
          # strictly stronger assertion than errors.Is. Switching these to
          # errors.Is would weaken exactly what they exist to prove.
          - errorlint
          # (*sql.DB).Ping against a fake driver, where there is no context to
          # thread and nothing for cancellation to do.
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/allianz/yukimi

issues:
  # Report everything. A truncated list hides the finding you needed.
  max-issues-per-linter: 0
  max-same-issues: 0
